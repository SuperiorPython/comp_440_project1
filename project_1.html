<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Drop</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

canvas{
    border:3px solid white;
    background:#1a1a1a;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const player = {
    x: 120,
    y: 345,
    radius: 15,
    velocityY: 0,
    gravityDirection: 1
};

const BASE_GRAVITY = 0.6;
let gravityStrength = BASE_GRAVITY;

const obstacles = [];

const OBSTACLE_WIDTH = 40;
const OBSTACLE_HEIGHT = 90;

const START_OBSTACLE_SPEED = 4;
const SPEED_INCREASE_RATE = 0.20;

const MAX_OBSTACLE_GAP = 280;
let distanceSinceLastSpawn = 0;

let obstacleSpeed = START_OBSTACLE_SPEED;

let gameOver = false;
let survivalTime = 0;
let startTime = Date.now();

document.addEventListener("keydown", (event) => {
    if(event.code === "Space") {
        if(gameOver){
            restartGame();
            return;
        }

        player.gravityDirection *= -1;
    }
});

function restartGame(){
    obstacles.length = 0;

    player.y = canvas.height - 55;
    player.velocityY = 0;
    player.gravityDirection = 1;

    obstacleSpeed = START_OBSTACLE_SPEED;
    gravityStrength = BASE_GRAVITY;
    distanceSinceLastSpawn = 0;

    gameOver = false;
    survivalTime = 0;
    startTime = Date.now();
}

function spawnObstacle(){
    const spawnOnTop = Math.random() < 0.5;

    obstacles.push({
        x: canvas.width,
        y: spawnOnTop
            ? 40
            : canvas.height - 40 - OBSTACLE_HEIGHT,
        width: OBSTACLE_WIDTH,
        height: OBSTACLE_HEIGHT
    });
}

function updatePlayer(){
    player.velocityY += gravityStrength * player.gravityDirection;
    player.y += player.velocityY;

    const floorY = canvas.height - 55;
    const ceilingY = 55;

    if(player.y > floorY){
        player.y = floorY;
        player.velocityY = 0;
    }

    if(player.y < ceilingY){
        player.y = ceilingY;
        player.velocityY = 0;
    }
}

function updateDifficulty(){
    obstacleSpeed = START_OBSTACLE_SPEED + survivalTime * SPEED_INCREASE_RATE;

    gravityStrength = Math.min(
        BASE_GRAVITY + survivalTime * 0.03,
        1.1
    );
}

function updateObstacles(){
    updateDifficulty();

    distanceSinceLastSpawn += obstacleSpeed;

    if(distanceSinceLastSpawn >= MAX_OBSTACLE_GAP){
        spawnObstacle();
        distanceSinceLastSpawn = 0;
    }

    for(let i = obstacles.length - 1; i >= 0; i--){
        obstacles[i].x -= obstacleSpeed;

        if(obstacles[i].x + obstacles[i].width < 0){
            obstacles.splice(i,1);
        }
    }
}

function checkCollisions(){
    for(const obstacle of obstacles){
        const closestX = Math.max(
            obstacle.x,
            Math.min(player.x, obstacle.x + obstacle.width)
        );

        const closestY = Math.max(
            obstacle.y,
            Math.min(player.y, obstacle.y + obstacle.height)
        );

        const dx = player.x - closestX;
        const dy = player.y - closestY;

        const distanceSquared = dx * dx + dy * dy;

        if(distanceSquared < player.radius * player.radius){
            gameOver = true;
            return;
        }
    }
}

function updateTimer(){
    survivalTime = Number(((Date.now() - startTime) / 1000).toFixed(1));
}

function drawBackground(){
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(0,40);
    ctx.lineTo(canvas.width,40);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,canvas.height-40);
    ctx.lineTo(canvas.width,canvas.height-40);
    ctx.stroke();
}

function drawPlayer(){
    ctx.fillStyle = "#00ffcc";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function drawObstacles(){
    ctx.fillStyle = "#ff4d6d";

    for(const obstacle of obstacles){
        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );
    }
}

function drawHUD(){
    ctx.fillStyle = "white";

    ctx.textAlign = "left";
    ctx.font = "22px Arial";
    ctx.fillText(
        `Time: ${survivalTime.toFixed(1)}s`,
        20,
        30
    );

    ctx.textAlign = "center";
    ctx.font = "24px Arial";
    ctx.fillText(
        "GRAVITY DROP",
        canvas.width / 2,
        30
    );

    ctx.textAlign = "right";
    ctx.font = "22px Arial";
    ctx.fillText(
        `Speed: ${obstacleSpeed.toFixed(1)}`,
        canvas.width - 20,
        30
    );

    ctx.textAlign = "left";
    ctx.font = "16px Arial";
    ctx.fillText(
        "SPACE = Reverse Gravity",
        20,
        canvas.height - 12
    );

    ctx.textAlign = "right";
    ctx.fillText(
        "Avoid Red Obstacles",
        canvas.width - 20,
        canvas.height - 12
    );
}

function drawGameOver(){
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = "white";
    ctx.textAlign = "center";

    ctx.font = "42px Arial";
    ctx.fillText(
        "GAME OVER",
        canvas.width / 2,
        canvas.height / 2 - 30
    );

    ctx.font = "24px Arial";
    ctx.fillText(
        `Survived ${survivalTime.toFixed(1)} seconds`,
        canvas.width / 2,
        canvas.height / 2 + 10
    );

    ctx.fillText(
        "Press SPACE to restart",
        canvas.width / 2,
        canvas.height / 2 + 50
    );
}

function draw(){
    drawBackground();
    drawObstacles();
    drawPlayer();
    drawHUD();

    if(gameOver){
        drawGameOver();
    }
}

function gameLoop(){
    if(!gameOver){
        updatePlayer();
        updateObstacles();
        checkCollisions();
        updateTimer();
    }

    draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
