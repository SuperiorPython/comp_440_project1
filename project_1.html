<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Drop</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    border:3px solid white;
    background:#1a1a1a;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const player = {
    x: 120,
    y: 345,
    radius: 15,
    velocityY: 0,
    gravityDirection: 1
};

const GRAVITY = 0.6;

document.addEventListener("keydown", (event) => {

    if(event.code === "Space"){
        player.gravityDirection *= -1;
    }

});

function updatePlayer(){

    player.velocityY += GRAVITY * player.gravityDirection;
    player.y += player.velocityY;

    const floorY = canvas.height - 55;
    const ceilingY = 55;

    if(player.y > floorY){
        player.y = floorY;
        player.velocityY = 0;
    }

    if(player.y < ceilingY){
        player.y = ceilingY;
        player.velocityY = 0;
    }
}

function drawBackground(){

    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(0,40);
    ctx.lineTo(canvas.width,40);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,canvas.height-40);
    ctx.lineTo(canvas.width,canvas.height-40);
    ctx.stroke();
}

function drawPlayer(){

    ctx.fillStyle = "#00ffcc";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function drawTitle(){

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Gravity Drop",
        canvas.width / 2,
        30
    );
}

function draw(){

    drawBackground();
    drawPlayer();
    drawTitle();

}

function gameLoop(){

    updatePlayer();
    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
