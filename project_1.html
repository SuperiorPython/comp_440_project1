<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Drop</title>

<style>
body{
    margin:0;
    background:#111;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

canvas{
    border:3px solid white;
    background:#1a1a1a;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const player = {
    x: 120,
    y: 345,
    radius: 15,
    velocityY: 0,
    gravityDirection: 1
};

const GRAVITY = 0.6;

const obstacles = [];

const OBSTACLE_WIDTH = 40;
const OBSTACLE_HEIGHT = 90;
const OBSTACLE_SPEED = 4;
const SPAWN_INTERVAL = 1200;

let lastSpawnTime = 0;

document.addEventListener("keydown", (event) => {

    if(event.code === "Space"){
        player.gravityDirection *= -1;
    }

});

function spawnObstacle(){

    const spawnOnTop = Math.random() < 0.5;

    obstacles.push({
        x: canvas.width,
        y: spawnOnTop
            ? 40
            : canvas.height - 40 - OBSTACLE_HEIGHT,
        width: OBSTACLE_WIDTH,
        height: OBSTACLE_HEIGHT
    });

}

function updatePlayer(){

    player.velocityY += GRAVITY * player.gravityDirection;
    player.y += player.velocityY;

    const floorY = canvas.height - 55;
    const ceilingY = 55;

    if(player.y > floorY){
        player.y = floorY;
        player.velocityY = 0;
    }

    if(player.y < ceilingY){
        player.y = ceilingY;
        player.velocityY = 0;
    }
}

function updateObstacles(timestamp){

    if(timestamp - lastSpawnTime > SPAWN_INTERVAL){
        spawnObstacle();
        lastSpawnTime = timestamp;
    }

    for(let i = obstacles.length - 1; i >= 0; i--){

        obstacles[i].x -= OBSTACLE_SPEED;

        if(obstacles[i].x + obstacles[i].width < 0){
            obstacles.splice(i,1);
        }

    }

}

function drawBackground(){

    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = "white";
    ctx.lineWidth = 4;

    ctx.beginPath();
    ctx.moveTo(0,40);
    ctx.lineTo(canvas.width,40);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,canvas.height-40);
    ctx.lineTo(canvas.width,canvas.height-40);
    ctx.stroke();
}

function drawPlayer(){

    ctx.fillStyle = "#00ffcc";

    ctx.beginPath();
    ctx.arc(
        player.x,
        player.y,
        player.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function drawObstacles(){

    ctx.fillStyle = "#ff4d6d";

    for(const obstacle of obstacles){

        ctx.fillRect(
            obstacle.x,
            obstacle.y,
            obstacle.width,
            obstacle.height
        );

    }

}

function drawTitle(){

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.textAlign = "center";

    ctx.fillText(
        "Gravity Drop",
        canvas.width / 2,
        30
    );
}

function draw(){

    drawBackground();
    drawObstacles();
    drawPlayer();
    drawTitle();

}

function gameLoop(timestamp){

    updatePlayer();
    updateObstacles(timestamp);
    draw();

    requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
